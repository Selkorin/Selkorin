[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "selkorin-sky-sentinel"
version = "0.1.0"
description = "Оптико-электронная система мониторинга неба, обнаружения дронов и лазерного наведения"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
cv = ["opencv-python>=4.8"]
hw = ["pyserial>=3.5"]
dev = ["pytest>=7.4"]

[project.scripts]
sky-sentinel = "dls.__main__:main"

[tool.setuptools]
packages = ["dls"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
