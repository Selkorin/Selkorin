<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad)" rx="100"/>

  <!-- Phone shape -->
  <rect x="140" y="100" width="232" height="360" fill="white" rx="24" opacity="0.95"/>

  <!-- Screen -->
  <rect x="160" y="130" width="192" height="280" fill="#1F2937" rx="16"/>

  <!-- Screen content - dots -->
  <circle cx="200" cy="200" r="8" fill="#3B82F6" opacity="0.7"/>
  <circle cx="280" cy="220" r="8" fill="#10B981" opacity="0.7"/>
  <circle cx="240" cy="300" r="8" fill="#F59E0B" opacity="0.7"/>

  <!-- Home indicator -->
  <rect x="190" y="425" width="132" height="5" fill="#1F2937" rx="2.5"/>

  <!-- Camera notch -->
  <circle cx="256" cy="115" r="6" fill="#1F2937"/>
</svg>
