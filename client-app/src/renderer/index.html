<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Selkorin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="drag-strip"></div>

  <!-- ЭКРАН БЛОКИРОВКИ (показывается только если пользователь включил защиту) -->
  <section id="lock" class="lock" hidden>
    <div class="wordmark lg">SELKORIN</div>
    <div class="lock-sub" id="lockSub">введите код</div>

    <!-- PIN -->
    <div id="lockPin" class="lock-pane" hidden>
      <div class="pin-dots" id="pinDots">
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
        <span class="pin-dot"></span><span class="pin-dot"></span><span class="pin-dot"></span>
      </div>
      <div class="pinpad" id="pinpad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="pin-bio" id="bioKey" hidden>👆</button><button data-k="0">0</button><button class="pin-del" id="delKey">⌫</button>
      </div>
    </div>

    <!-- ГРАФИЧЕСКИЙ КЛЮЧ -->
    <div id="lockPattern" class="lock-pane" hidden>
      <div class="pattern-host" id="patternHost"></div>
      <button class="btn ghost" id="patBioKey" hidden>👆 Touch ID</button>
    </div>

    <div id="lockErr" class="lock-err"></div>
  </section>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <main id="main" class="main" hidden>
    <header class="top">
      <div class="wordmark">SELKORIN</div>
      <div class="top-actions">
        <button id="settingsBtn" class="icon-btn" title="Настройки">⚙</button>
        <button id="lockNowBtn" class="icon-btn" title="Заблокировать" hidden>⏻</button>
      </div>
    </header>

    <div class="hero">
      <button id="powerBtn" class="power" aria-label="Подключить">
        <span class="power-ring"></span>
        <span class="power-ico">⏻</span>
      </button>
      <div class="hero-status" id="heroStatus">Отключено</div>
      <div class="hero-server" id="heroServer">ключ не выбран</div>
    </div>

    <div class="keys">
      <div class="keys-head">
        <span>Мои ключи</span>
        <button id="addKeyBtn" class="btn sm primary">＋ Добавить ключ</button>
      </div>
      <div id="keyList" class="key-list"></div>
      <div id="keyEmpty" class="key-empty" hidden>
        Ключей пока нет. Нажмите «Добавить ключ» и вставьте <code>vless://…</code> или WireGuard-конфиг, либо отсканируйте QR.
      </div>
    </div>

    <footer class="foot"><span id="ver">v1.0.0</span> · WireGuard · VLESS Reality</footer>
  </main>

  <!-- Модалка -->
  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
