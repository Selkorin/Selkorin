<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Selkorin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="drag-strip"></div>

  <!-- ЭКРАН БЛОКИРОВКИ -->
  <section id="lock" class="lock">
    <img class="lock-logo" src="dragon.svg" alt="Selkorin" />
    <div class="lock-name">SELKORIN</div>
    <div class="lock-sub" id="lockSub">введите пароль</div>
    <input id="lockPass" class="lock-input" type="password" placeholder="••••••" autocomplete="off" />
    <input id="lockPass2" class="lock-input" type="password" placeholder="повторите пароль" autocomplete="off" hidden />
    <button id="lockBtn" class="btn primary wide">Разблокировать</button>
    <button id="bioBtn" class="btn ghost wide" hidden>🔒 Touch ID</button>
    <div id="lockErr" class="lock-err"></div>
  </section>

  <!-- ОСНОВНОЙ ЭКРАН -->
  <main id="main" class="main" hidden>
    <header class="top">
      <div class="top-brand"><img src="dragon.svg" class="top-logo" alt="" />SELKORIN</div>
      <div class="top-actions">
        <button id="settingsBtn" class="icon-btn" title="Настройки">⚙</button>
        <button id="lockNowBtn" class="icon-btn" title="Заблокировать">⏻</button>
      </div>
    </header>

    <div class="hero">
      <button id="powerBtn" class="power" aria-label="Подключить">
        <span class="power-ring"></span>
        <span class="power-ico">⏻</span>
      </button>
      <div class="hero-status" id="heroStatus">Отключено</div>
      <div class="hero-server" id="heroServer">ключ не выбран</div>
    </div>

    <div class="keys">
      <div class="keys-head">
        <span>Мои ключи</span>
        <button id="addKeyBtn" class="btn sm primary">＋ Вставить ключ</button>
      </div>
      <div id="keyList" class="key-list"></div>
      <div id="keyEmpty" class="key-empty" hidden>
        Ключей пока нет. Нажмите «Вставить ключ» и вставьте <code>vless://…</code> или WireGuard-конфиг, который дал администратор.
      </div>
    </div>

    <footer class="foot"><span id="ver">v1.0.0</span> · WireGuard · VLESS Reality</footer>
  </main>

  <!-- Модалка -->
  <div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
