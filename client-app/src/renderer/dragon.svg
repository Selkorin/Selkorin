<svg viewBox="0 0 1010 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selkorin dragon">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#e9ebf2"/>
      <stop offset="0.42" stop-color="#a9adbd"/>
      <stop offset="0.62" stop-color="#5f6473"/>
      <stop offset="0.82" stop-color="#33363f"/>
      <stop offset="1"   stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="chromeWingL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#b6bacb"/>
      <stop offset="0.7" stop-color="#4a4e5c"/>
      <stop offset="1"   stop-color="#191a20"/>
    </linearGradient>
    <linearGradient id="chromeWingR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#b6bacb"/>
      <stop offset="0.7" stop-color="#4a4e5c"/>
      <stop offset="1"   stop-color="#191a20"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#soft)" stroke-linejoin="round">
    <!-- LEFT WING -->
    <path fill="url(#chromeWingL)" stroke="url(#edge)" stroke-width="2"
      d="M470,252
         C 320,170 175,122 70,74
         C 60,70 55,80 64,86
         C 190,170 315,240 430,302
         C 448,287 460,270 470,252 Z"/>
    <path fill="#ffffff" fill-opacity="0.16"
      d="M455,264 C 330,194 210,142 96,94 C 210,168 330,234 432,292 Z"/>

    <!-- RIGHT WING (mirror x' = 1010 - x) -->
    <path fill="url(#chromeWingR)" stroke="url(#edge)" stroke-width="2"
      d="M540,252
         C 690,170 835,122 940,74
         C 950,70 955,80 946,86
         C 820,170 695,240 580,302
         C 562,287 550,270 540,252 Z"/>
    <path fill="#ffffff" fill-opacity="0.16"
      d="M555,264 C 680,194 800,142 914,94 C 800,168 680,234 578,292 Z"/>

    <!-- BODY: serpentine spine from shoulders down to a bold tail flick -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="2"
      d="M505,244
         C 468,300 470,354 500,406
         C 534,462 548,514 520,568
         C 502,606 508,644 548,700
         C 494,672 466,622 478,566
         C 488,518 462,470 446,428
         C 424,372 440,304 505,244 Z"/>
    <!-- secondary tail flick (left), solid and tapered -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="1.5"
      d="M462,446
         C 448,498 428,540 392,566
         C 420,556 442,532 456,504
         C 466,486 470,466 468,448 Z"/>

    <!-- NECK from shoulders up to the head -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="2"
      d="M505,244
         C 492,214 486,196 490,178
         C 500,176 512,180 520,192
         C 528,214 522,236 505,244 Z"/>

    <!-- HEAD: angular reptilian head facing left, open jaw -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="2"
      d="M500,182
         L 470,152
         C 456,150 444,157 436,170
         L 398,190
         L 424,199
         L 405,209
         L 430,216
         L 452,214
         C 470,236 494,232 508,214
         C 520,206 508,190 500,182 Z"/>
    <!-- open lower jaw -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="1.4"
      d="M430,216 L 402,230 L 436,228 L 452,220 Z"/>
    <!-- crest: three backswept horns -->
    <path fill="url(#chrome)" stroke="url(#edge)" stroke-width="1.5"
      d="M470,152 L 484,104 L 502,150 Z
         M502,156 L 540,118 L 524,172 Z
         M520,180 L 560,166 L 532,206 Z"/>
    <!-- brow ridge highlight -->
    <path fill="#ffffff" fill-opacity="0.20" d="M470,152 C 452,156 442,166 436,178 L 460,170 Z"/>
    <!-- eye -->
    <circle cx="452" cy="188" r="6.5" fill="#0b0b0f"/>
    <circle cx="450" cy="185" r="2" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
