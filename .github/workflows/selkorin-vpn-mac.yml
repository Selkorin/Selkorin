name: Build Selkorin VPN (macOS)

on:
  push:
    branches: [ "claude/greeting-31dz93" ]
    paths:
      - "desktop-app/**"
      - ".github/workflows/selkorin-vpn-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install librsvg (icon rasteriser)
        run: brew install librsvg

      - name: Build app icon (SVG -> PNG -> ICNS)
        run: |
          mkdir -p build/icons
          for s in 16 32 64 128 256 512 1024; do
            rsvg-convert -w "$s" -h "$s" build/icon.svg -o "build/icons/icon_$s.png"
          done
          node build/pack-icns.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package .app (Apple Silicon + Intel)
        run: |
          npm run pack:mac-arm
          npm run pack:mac-x64

      - name: Ad-hoc code sign (so it launches on Apple Silicon)
        run: |
          codesign --force --deep --sign - "dist/Selkorin VPN-darwin-arm64/Selkorin VPN.app"
          codesign --force --deep --sign - "dist/Selkorin VPN-darwin-x64/Selkorin VPN.app"

      - name: Build DMG installers
        run: |
          hdiutil create -volname "Selkorin VPN" -srcfolder "dist/Selkorin VPN-darwin-arm64/Selkorin VPN.app" -ov -format UDZO "$GITHUB_WORKSPACE/Selkorin-VPN-AppleSilicon.dmg"
          hdiutil create -volname "Selkorin VPN" -srcfolder "dist/Selkorin VPN-darwin-x64/Selkorin VPN.app" -ov -format UDZO "$GITHUB_WORKSPACE/Selkorin-VPN-Intel.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selkorin-VPN-macOS
          path: |
            Selkorin-VPN-AppleSilicon.dmg
            Selkorin-VPN-Intel.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "selkorin-vpn-build-${{ github.run_number }}" \
            "$GITHUB_WORKSPACE/Selkorin-VPN-AppleSilicon.dmg" \
            "$GITHUB_WORKSPACE/Selkorin-VPN-Intel.dmg" \
            --title "Selkorin VPN — сборка ${{ github.run_number }}" \
            --target "claude/greeting-31dz93" \
            --notes "Готовое приложение для macOS. Скачай Selkorin-VPN-AppleSilicon.dmg (Mac на M1/M2/M3/M4) или Selkorin-VPN-Intel.dmg (старые Intel Mac). Открой .dmg, перетащи «Selkorin VPN» в «Программы». Первый запуск: правый клик по приложению → «Открыть». Если macOS не пускает — в Терминале выполни: xattr -cr \"/Applications/Selkorin VPN.app\""
